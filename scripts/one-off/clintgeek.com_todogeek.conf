map $http_upgrade $connection_upgrade {
	default upgrade;
	''	close;
}

server {
	listen 80;
	server_name todogeek.clintgeek.com;

	location / {
	  return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	server_name todogeek.clintgeek.com;

	# ssl on;
	ssl_protocols TLSv1.2;
	ssl_prefer_server_ciphers on;
	ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
	ssl_ecdh_curve secp384r1; # Requires nginx >= 1.1.0
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off; # Requires nginx >= 1.5.9
	ssl_stapling on; # Requires nginx >= 1.3.7
	ssl_stapling_verify on; # Requires nginx => 1.3.7
	resolver 8.8.8.8 valid=300s;
	resolver_timeout 5s;
	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
	add_header X-Frame-Options DENY;
	add_header X-Content-Type-Options nosniff;
	ssl_certificate /etc/nginx/certs/_.clintgeek.com_ssl_cert_combined.cer;
	ssl_certificate_key /etc/nginx/certs/_.clintgeek.com_private_key.key;
	ssl_dhparam /etc/nginx/certs/dhparams.pem;

# Proxy GraphQL requests to BaseGeek's unified Apollo Server
location /graphql {
    proxy_pass http://192.168.1.17:8987/graphql;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_header Authorization;
    proxy_set_header Authorization $http_authorization;
}

location / {
    proxy_pass http://192.168.1.17:5005;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Websockets / upgrades
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
}

# BuJoGeek was renamed TodoGeek on 2026-10-10. The old names are dead on
# purpose (Chef: no redirect, so nothing keeps using them). Without this block
# they would fall through to the first server (the root site).
server {
	listen 80;
	listen 443 ssl;
	server_name bujogeek.clintgeek.com bujo.clintgeek.com;
	ssl_certificate /etc/nginx/certs/_.clintgeek.com_ssl_cert_combined.cer;
	ssl_certificate_key /etc/nginx/certs/_.clintgeek.com_private_key.key;
	return 410;
}
