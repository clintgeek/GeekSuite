name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-basegeek:
    name: basegeek api tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # mongodb-memory-server downloads a ~400MB mongod on first run; cache it
      # so CI doesn't pay (or hang on) that download every time.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - name: Run jest (mongodb-memory-server)
        working-directory: apps/basegeek/packages/api
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand

  test-bookgeek:
    name: bookgeek api tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run node --test
        working-directory: apps/bookgeek/api
        run: npm test

  test-notegeek:
    name: notegeek frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/notegeek/frontend
        run: npx vitest run

  build-frontends:
    name: frontend build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bujogeek
            dir: apps/bujogeek/frontend
          - app: notegeek
            dir: apps/notegeek/frontend
          - app: bookgeek
            dir: apps/bookgeek/web
          - app: fitnessgeek
            dir: apps/fitnessgeek/frontend
          - app: storygeek
            dir: apps/storygeek/frontend
          - app: flockgeek
            dir: apps/flockgeek/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        working-directory: ${{ matrix.dir }}
        run: npm run build
