name: CI

# Three kinds of job, and a gate:
#
#   static  - eslint, the syntax gate, the gql audits, boot smoke. Always.
#   shared  - every packages/* suite, one step each. Always.
#   app     - one job per app: backend tests, frontend tests, the production
#             build and the PWA audit of that build. Only the apps a push
#             touches (tools/ci-affected.mjs); basegeek always, because its
#             api suite reads the other apps' files.
#   ci gate - needs the three above; the one name branch protection has to
#             know.
#
# Until 2026-11-18 this was 59 jobs (one per suite, a build smoke AND a PWA
# audit per app, each paying its own checkout + install), which queued behind
# the 20-job concurrency limit: 10 minutes of wall clock for a longest job of
# 4. "Only what changed" is measured from the last GREEN run of this
# workflow, so a red or cancelled run's changes are covered by the next one.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'DOCS/**'
      - '**/DOCS/**'
      - 'LICENSE'
  push:
    branches: [main]
    # Documentation-only pushes skip CI. If branch protection ever requires these
    # checks, docs-only PRs will need the checks marked as not-required or a
    # trivial pass-through job — see DOCS/CICD.md.
    paths-ignore:
      - '**/*.md'
      - 'DOCS/**'
      - '**/DOCS/**'
      - 'LICENSE'

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Apps touched since the last green CI run on main
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        # A pull request, or no green run to measure from, means every app.
        run: |
          base=""
          if [ "$EVENT" = "push" ]; then
            base=$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          fi
          node tools/ci-affected.mjs --for ci --base "$base" >> "$GITHUB_OUTPUT"

  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Errors gate; warnings don't (see DOCS/CICD.md). `-r` skips packages
      # without a lint script, so new packages opt in by adding one.
      - name: eslint
        run: pnpm -r lint
      # Cheap universal gate: every .js/.mjs/.cjs under apps/*/** and
      # packages/*/** must at least parse. No test suite imports every
      # module, so this is the only thing that would have caught the
      # basegeek SyntaxError crash-loop on 2026-09-05 (fixed in 61d3109) —
      # see DOCS/RUNBOOK.md's "syntax gate" entry.
      - name: syntax check (parseable modules)
        if: ${{ !cancelled() }}
        run: node tools/syntax-check.mjs
      # The drift GraphQL itself will not report: a key in a `variables`
      # object the document declares no `$var` for, or a `$var` declared and
      # never passed, is dropped in SILENCE — the request succeeds and the
      # field is never written. Cross-checks every gql document under
      # apps/*/frontend/src and friends against the gateway's own typeDefs,
      # both directions. See DOCS/RUNBOOK.md's "gql argument audit" entry.
      - name: gql argument audit (frontend vs gateway)
        if: ${{ !cancelled() }}
        run: node tools/gql-arg-audit.mjs
      # DOCS/GRAPHQL.md §4 is generated from the typeDefs. Fail the build if a
      # typeDefs change lands without `node tools/gql-surface.mjs --write`.
      - name: gql surface doc is current
        if: ${{ !cancelled() }}
        run: node tools/gql-surface.mjs --check
      # Catches the other outage class the syntax gate can't: a module that
      # parses fine but throws on import (missing export, bad workspace path,
      # CJS/ESM interop) or a service that boots without a required env var.
      # Fake KEY_VAULT_SECRET/Mongo URIs only — see tools/boot-smoke.mjs.
      - name: boot smoke (import-time + env)
        if: ${{ !cancelled() }}
        run: node tools/boot-smoke.mjs
      # The filter every workflow trusts to skip work.
      - name: ci-affected tests
        if: ${{ !cancelled() }}
        run: node --test tools/ci-affected.test.mjs

  shared:
    name: shared package tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ui (theme contrast; reads the apps' themes)
        if: ${{ !cancelled() }}
        working-directory: packages/ui
        run: npx vitest run
      - name: collection (filters, URL state, paged list, query helpers)
        if: ${{ !cancelled() }}
        working-directory: packages/collection
        run: npx vitest run
      - name: utils (dates; must not care that the suite runs on America/Chicago)
        if: ${{ !cancelled() }}
        working-directory: packages/utils
        run: npx vitest run
      - name: tags (the tag standard)
        if: ${{ !cancelled() }}
        working-directory: packages/tags
        run: npx vitest run
      - name: task-grammar (loaded the way the gateway does, plain Node)
        if: ${{ !cancelled() }}
        working-directory: packages/task-grammar
        run: node --test test/*.test.js
      - name: schemas (every export loads; a throw at require time crash-loops a container)
        if: ${{ !cancelled() }}
        working-directory: packages/schemas
        run: node --test test/*.test.js
      - name: crypto-vault
        if: ${{ !cancelled() }}
        working-directory: packages/crypto-vault
        run: npx vitest run
      - name: api-client
        if: ${{ !cancelled() }}
        working-directory: packages/api-client
        run: npx vitest run
      - name: auth (csrf headers)
        if: ${{ !cancelled() }}
        working-directory: packages/auth
        run: npm test
      - name: logger
        if: ${{ !cancelled() }}
        working-directory: packages/logger
        run: npx vitest run
      - name: user (csrf guard)
        if: ${{ !cancelled() }}
        working-directory: packages/user
        run: npm test
      - name: backdrop helpers
        if: ${{ !cancelled() }}
        working-directory: packages/backdrop
        run: node --test src/*.test.js

  app:
    name: ${{ matrix.app }} tests + build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      # mongodb-memory-server's mongod (7.0.14, and 7.0.24 for newsgeek's
      # ingest tests) has no ubuntu-24.04 build: force the 22.04 binary.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
      MONGOMS_DISTRO: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # mongodb-memory-server downloads a ~400MB mongod on first run; cache it
      # so CI doesn't pay (or hang on) that download every time.
      - uses: actions/cache@v4
        if: ${{ matrix.mongo }}
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: ${{ matrix.mongo }}-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      # basegeek's command carries --forceExit: all suites pass, then a
      # singleton service's open handle keeps jest alive forever. Hunting the
      # handle is backlogged; forceExit is safe post-"Ran all test suites".
      - name: Backend tests
        if: ${{ matrix.be }}
        working-directory: ${{ matrix.be }}
        run: ${{ matrix.be_cmd }}
      - name: Frontend tests
        if: ${{ !cancelled() && matrix.fe }}
        working-directory: ${{ matrix.fe }}
        run: npx vitest run
      - name: Production build
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.web }}
        run: npm run build
      # Checks the BUILT output: one manifest link; manifest fields; every
      # icon exists at its declared pixel size, incl. a 512 maskable; an opaque
      # 180px apple-touch PNG; theme colours; the service worker is registered,
      # bypasses auth, precaches every hashed chunk (and woff2, or has a font
      # rule), and its navigateFallback denylist keeps the SPA shell off /api,
      # /graphql and file-extension paths. No network, no deps — see
      # tools/pwa-audit.mjs and DOCS/PWA_STANDARD.md.
      - name: PWA audit
        run: node tools/pwa-audit.mjs --app ${{ matrix.app }}

  gate:
    name: ci gate
    needs: [changes, static, shared, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
