name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'DOCS/**'
      - '**/DOCS/**'
      - 'LICENSE'
  push:
    branches: [main]
    # Documentation-only pushes skip CI. If branch protection ever requires these
    # checks, docs-only PRs will need the checks marked as not-required or a
    # trivial pass-through job — see DOCS/CICD.md.
    paths-ignore:
      - '**/*.md'
      - 'DOCS/**'
      - '**/DOCS/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-basegeek:
    name: basegeek api tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # mongodb-memory-server downloads a ~400MB mongod on first run; cache it
      # so CI doesn't pay (or hang on) that download every time.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - name: Run jest (mongodb-memory-server)
        working-directory: apps/basegeek/packages/api
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
          MONGOMS_DISTRO: ubuntu-22.04
        # --forceExit: all suites pass in ~16s, then a singleton service's
        # open handle keeps the process alive forever ("Jest did not exit one
        # second after the test run has completed"). Hunting the handle is
        # backlogged; forceExit is safe post-"Ran all test suites".
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand --forceExit

  test-bookgeek:
    name: bookgeek api tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run node --test
        working-directory: apps/bookgeek/api
        run: npm test

  test-notegeek:
    name: notegeek frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/notegeek/frontend
        run: npx vitest run

  test-bookgeek-web:
    name: bookgeek web frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/bookgeek/web
        run: npx vitest run

  test-flockgeek:
    name: flockgeek frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/flockgeek/frontend
        run: npx vitest run

  test-storygeek:
    name: storygeek frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/storygeek/frontend
        run: npx vitest run

  test-fitnessgeek-web:
    name: fitnessgeek frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/fitnessgeek/frontend
        run: npx vitest run

  test-basegeek-ui:
    name: basegeek admin console tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/basegeek/packages/ui
        run: npx vitest run

  test-ui:
    name: shared ui tests (theme contrast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: packages/ui
        run: npx vitest run

  test-utils:
    name: shared utils tests (dates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite runs on America/Chicago; the date helpers must not care, and
      # the suite drives its own timezones per assertion regardless.
      - name: Run vitest
        working-directory: packages/utils
        run: npx vitest run

  test-crypto-vault:
    name: shared crypto-vault tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: packages/crypto-vault
        run: npx vitest run

  test-api-client:
    name: shared api-client tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: packages/api-client
        run: npx vitest run

  test-auth:
    name: shared auth tests (csrf headers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run node --test
        working-directory: packages/auth
        run: npm test

  test-logger:
    name: shared logger tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: packages/logger
        run: npx vitest run

  test-user:
    name: shared user tests (csrf guard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run node --test
        working-directory: packages/user
        run: npm test

  test-bujogeek:
    name: bujogeek frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run vitest
        working-directory: apps/bujogeek/frontend
        run: npx vitest run

  test-startgeek:
    name: startgeek unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/startgeek/package-lock.json
      # Standalone app (no @geeksuite workspace deps) — npm + its own
      # lockfile, no pnpm workspace install (see apps/startgeek/Dockerfile).
      - name: Install dependencies
        working-directory: apps/startgeek
        run: npm ci
      - name: Run node --test
        working-directory: apps/startgeek
        run: npm test

  test-backends:
    name: backend auth tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bujogeek
            dir: apps/bujogeek/backend
          - app: fitnessgeek
            dir: apps/fitnessgeek/backend
          - app: flockgeek
            dir: apps/flockgeek/backend
          - app: storygeek
            dir: apps/storygeek/backend
          - app: notegeek
            dir: apps/notegeek/backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # notegeek's suite uses mongodb-memory-server pinned to mongod 7.0.14, which
      # has no ubuntu-24.04 build; force the 22.04 binary (glibc-compatible) and
      # share the same cache as the basegeek job.
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-ubuntu2204-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - name: Test ${{ matrix.app }} backend
        working-directory: ${{ matrix.dir }}
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
          MONGOMS_DISTRO: ubuntu-22.04
        run: pnpm test

  lint:
    name: eslint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Errors gate; warnings don't (see DOCS/CICD.md). `-r` skips packages
      # without a lint script, so new packages opt in by adding one.
      - run: pnpm -r lint

  syntax:
    name: syntax check (parseable modules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Cheap universal gate: every .js/.mjs/.cjs under apps/*/** and
      # packages/*/** must at least parse. No test suite imports every
      # module, so this is the only thing that would have caught the
      # basegeek SyntaxError crash-loop on 2026-09-05 (fixed in 61d3109) —
      # see DOCS/RUNBOOK.md's "syntax gate" entry.
      - run: node tools/syntax-check.mjs

  gql-audit:
    name: gql argument audit (frontend vs gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The drift GraphQL itself will not report: a key in a `variables`
      # object the document declares no `$var` for, or a `$var` declared and
      # never passed, is dropped in SILENCE — the request succeeds and the
      # field is never written. flockgeek shipped `source` to
      # `recordEggProduction` for the life of the feature that way, and a unit
      # test asserted it, because both sides of a frontend test are the
      # client. Cross-checks every gql document under apps/*/frontend/src and
      # friends against the gateway's own typeDefs, both directions.
      # See DOCS/RUNBOOK.md's "gql argument audit" entry.
      - run: node tools/gql-arg-audit.mjs

  boot-smoke:
    name: boot smoke (import-time + env)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Catches the other outage class the syntax gate can't: a module that
      # parses fine but throws on import (missing export, bad workspace path,
      # CJS/ESM interop) or a service that boots without a required env var.
      # Fake KEY_VAULT_SECRET/Mongo URIs only — see tools/boot-smoke.mjs.
      - run: node tools/boot-smoke.mjs

  build-frontends:
    name: frontend build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bujogeek
            dir: apps/bujogeek/frontend
          - app: notegeek
            dir: apps/notegeek/frontend
          - app: bookgeek
            dir: apps/bookgeek/web
          - app: fitnessgeek
            dir: apps/fitnessgeek/frontend
          - app: storygeek
            dir: apps/storygeek/frontend
          - app: flockgeek
            dir: apps/flockgeek/frontend
          - app: basegeek
            dir: apps/basegeek/packages/ui
          - app: startgeek
            dir: apps/startgeek
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        working-directory: ${{ matrix.dir }}
        run: npm run build
