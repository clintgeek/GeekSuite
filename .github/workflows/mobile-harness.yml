name: Mobile harness

# The mobile grammar gate (DOCS/MOBILE_UI_PLAN.md §6). Builds every app,
# serves its dist, walks the app's scenes at 390x844 in both colour schemes,
# and fails on any tap target under 44px, any readable string under 12px, any
# sideways scroll, or any page error. The screenshots are uploaded so a
# reviewer can look at the phone without owning one.
#
# It also runs an axe-core pass (WCAG 2 A + AA) on every scene, and since
# 2026-09-05 that category is **enforcing** too: the run step passes
# --enforce-a11y, so any WCAG 2 A/AA violation fails the job. Findings are
# still printed and written to tools/mobile-harness/out/ci/SUMMARY.md
# (uploaded with the screenshots). The burn-down that earned the flip went
# 112 -> 39 -> 0 with no waivers (DOCS/MOBILE_UI_PLAN.md §2).
#
# Since 2026-09-25 it also gates the 1280x900 desktop contexts, dark and light
# (--desktop runs phone AND desktop, not desktop alone). Desktop is where the
# permanent sidebar lives, and it had 46 findings that no gate saw because the
# phone drawer is closed in every phone scene. The job went from ~17 to ~28
# minutes (220 -> 380 scenes), still inside the 45-minute timeout.
#
# Since 2026-09-30 it is SHARDED BY APP: one job per app in
# tools/mobile-harness/lib/registry.mjs (the `apps` job reads the list, so a
# new app joins the matrix on its own), each running phone + desktop for that
# app exactly as the single job did. The full run went 41-47 min -> about the
# slowest single app plus install (~10 min), and each app fails on its own.
#
# Branch protection (repo ruleset "Protect main") requires a check named
# exactly `mobile grammar (iPhone 14, dark + light)`. That name now belongs to
# the `gate` job, which needs every shard, always runs, and fails unless the
# app list and every shard succeeded. Do NOT rename it, and do not give any
# shard that name, without changing the ruleset in the same breath (Chef).
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/mobile-harness/**'
      - '.github/workflows/mobile-harness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tools/mobile-harness/**'
      - '.github/workflows/mobile-harness.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: mobile harness · app list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.list.outputs.apps }}
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: Apps touched since the last green harness run on main
        id: affected
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        # tools/ci-affected.mjs: an app's own files or scenes run that app's
        # shard; packages/, the harness itself or this workflow run them all;
        # so does a pull request, or having no green run to measure from.
        run: |
          base=""
          if [ "$EVENT" = "push" ]; then
            base=$(gh run list --workflow mobile-harness.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          fi
          node tools/ci-affected.mjs --for harness --base "$base" >> "$GITHUB_OUTPUT"
      - name: Read the app list from the harness registry
        id: list
        env:
          AFFECTED: ${{ steps.affected.outputs.apps }}
        # registry.mjs has no imports, so this needs no install.
        run: |
          apps=$(node --input-type=module -e "import { APP_NAMES } from './tools/mobile-harness/lib/registry.mjs'; const hit = JSON.parse(process.env.AFFECTED); console.log(JSON.stringify(APP_NAMES.filter((a) => hit.includes(a))))")
          echo "apps: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          # One shard per app, except FitnessGeek: 166 scenes × phone and
          # desktop outgrew one 25-minute job on 2026-10-17 (the job was
          # cancelled at the timeout). Its scenes are all numbered, and
          # FG_SCENES filters them, so it runs as shards by leading digit.
          # 2026-11-17: the 4+6 shard was cancelled at the timeout twice on one
          # push (19.5 min of scenes behind a 5.3-minute `--with-deps` apt
          # step), every scene it reached clean; 4 and 6 are now their own
          # shards and the job timeout went 25 -> 35 (ThingGeek and NoteGeek
          # finished the same push at 23-24 min).
          # Plus one TABLET shard each for NoteGeek and TodoGeek (review 4.1,
          # 2026-11): the Android tablet, 800x1280 dark + 1280x800 light
          # (one scheme per orientation; both schemes' contrast is already
          # gated on phone and desktop). Its own job, so no existing shard
          # gets longer and the wall time stays the slowest shard's; only
          # those two apps because they are what the tablet work is for, and
          # NoteGeek's ~60 scenes x 2 tablet contexts is ~11 min locally.
          # Screenshots land in out/ci/<app>/ with a -tablet / -tablet-land
          # suffix. It is ADVISORY (--tablet-advisory: findings listed in
          # SUMMARY.md, never failing the job) until the tablet wave clears
          # them; then drop that flag and it gates like the rest.
          shards=$(node --input-type=module -e "
            import { APP_NAMES } from './tools/mobile-harness/lib/registry.mjs';
            const split = { fitnessgeek: [['0-3', '^[0-3]'], ['4', '^4'], ['5', '^5'], ['6', '^6']] };
            const base = '--desktop';
            const tabletArgs = '--tablet-only --tablet-viewports tablet-dark,tablet-land-light --tablet-advisory';
            const hit = JSON.parse(process.env.AFFECTED);
            const names = APP_NAMES.filter((a) => hit.includes(a));
            const out = names.flatMap((app) => split[app]
              ? split[app].map(([part, scenes]) => ({ app, label: app + ' ' + part, key: app + '-' + part.replace('+', ''), scenes, args: base }))
              : [{ app, label: app, key: app, scenes: '', args: base }]);
            for (const app of ['notegeek', 'todogeek', 'geekday'].filter((a) => hit.includes(a))) {
              out.push({ app, label: app + ' tablet', key: app + '-tablet', scenes: '', args: tabletArgs });
            }
            console.log(JSON.stringify(out));")
          echo "shards: $shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  shard:
    name: mobile grammar · ${{ matrix.shard.label }}
    needs: apps
    # Nothing to walk when a push under apps/ touched only docs.
    if: needs.apps.outputs.shards != '[]'
    # Pinned, not ubuntu-latest: on 2026-10-29 ubuntu-latest became 26.04 and
    # Playwright 1.58.2 refused it ("does not support chromium on ubuntu26.04"),
    # failing every shard. Move this forward together with a Playwright bump.
    runs-on: ubuntu-24.04
    # One app, phone + desktop, the viewports walked side by side
    # (tools/mobile-harness/lib/parallel.mjs, since 2026-11-18).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.apps.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache the browser, not the download script: the key is the pinned
      # Playwright version, so a version bump invalidates it on its own.
      # Every shard shares the one key; the first to finish saves it.
      - name: Read the pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('./tools/mobile-harness/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}-chromium-${{ runner.os }}
      - name: Install Chromium
        # No --with-deps since 2026-11-18: it ran apt on every shard (5.3 min
        # of the 25 on 2026-11-17, most of it waiting on the mirror) to add
        # fonts and Xvfb. The runner image already carries the libraries
        # headless Chromium links against (apt reported them "set to manually
        # installed"). If a shard ever fails to LAUNCH the browser, or text
        # metrics shift, put the flag back or move the job into
        # mcr.microsoft.com/playwright. With the cache restored this step is
        # a no-op.
        run: npx playwright install chromium
        working-directory: tools/mobile-harness

      - name: Build, serve and probe ${{ matrix.shard.label }}
        # All four categories are enforcing. The three grammar rules have been
        # green since 2026-09-05 14:54; the axe-core a11y category joined them
        # later the same day at 0 findings across all eight apps. Drop
        # `--enforce-a11y` only to deliberately un-gate a11y, and say why.
        # `--desktop` adds the desktop contexts to the phone ones (ci.mjs:
        # ALL_VIEWPORTS). It has been enforcing since 2026-09-25, when the
        # desktop pass reached 0. Drop it only to deliberately un-gate
        # desktop, and say why.
        env:
          # Empty for every app but a split one: the app's own scene filter
          # (FitnessGeek's FG_SCENES) ignores an empty value and runs all.
          FG_SCENES: ${{ matrix.shard.scenes }}
        # `args` is '--desktop' for every app shard and the tablet flags for
        # the two tablet shards (see the app list job).
        run: pnpm --filter @geeksuite/mobile-harness run ci -- --enforce-a11y ${{ matrix.shard.args }} --app ${{ matrix.shard.app }}

      - name: Upload screenshots and SUMMARY.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-${{ matrix.shard.key }}-${{ github.run_id }}
          path: tools/mobile-harness/out/
          retention-days: 14
          if-no-files-found: warn
          # a re-run of this job re-uploads under the same name
          overwrite: true

  gate:
    # THE REQUIRED CHECK. This exact string is in the "Protect main" ruleset.
    name: mobile grammar (iPhone 14, dark + light)
    needs: [apps, shard]
    # always(), not !cancelled(): a skipped required check counts as passing
    # on GitHub, so this job must run (and fail) even when the shards were
    # cancelled or never started.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/mobile-harness

      - name: Download every shard's artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: mobile-harness-*-${{ github.run_id }}
          path: shards

      - name: Merge the shard summaries into one SUMMARY.md
        # Only node builtins; no install. Always exits 0 — it reports, the
        # last step decides.
        run: |
          node tools/mobile-harness/merge-summaries.mjs shards \
            --expect '${{ join(fromJSON(needs.apps.outputs.apps || '[]'), ',') }}' \
            --out combined/SUMMARY.md
          cat combined/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined SUMMARY.md
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-summary-${{ github.run_id }}
          path: combined/SUMMARY.md
          retention-days: 14
          if-no-files-found: warn
          # a re-run of this job re-uploads under the same name
          overwrite: true

      - name: Pass only if every shard passed
        # needs.shard.result folds the matrix: success only if every shard
        # succeeded; failure/cancelled/skipped (e.g. the app list failed)
        # all fail the gate.
        env:
          APPS_RESULT: ${{ needs.apps.result }}
          SHARD_RESULT: ${{ needs.shard.result }}
          SHARDS: ${{ needs.apps.outputs.shards }}
        run: |
          echo "app list: $APPS_RESULT   shards: $SHARD_RESULT"
          # No shards at all (nothing a shard reads changed) is a pass.
          if [ "$APPS_RESULT" = success ] && [ "$SHARD_RESULT" = skipped ] && [ "$SHARDS" = "[]" ]; then
            echo "no app affected; nothing to walk"
            exit 0
          fi
          if [ "$APPS_RESULT" != success ] || [ "$SHARD_RESULT" != success ]; then
            echo "::error::mobile harness failed (app list: $APPS_RESULT, shards: $SHARD_RESULT) — see the per-app 'mobile grammar · <app>' jobs and SUMMARY.md"
            exit 1
          fi
