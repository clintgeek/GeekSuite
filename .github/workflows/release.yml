name: Release images

# Tier 3.3 (DOCS/CICD.md): publish suite images to GHCR on every main
# commit. The production box pulls via Watchtower — no inbound CI access.

on:
  push:
    branches: [main]
    # Documentation-only commits must not rebuild and redeploy eight images.
    paths-ignore:
      - '**/*.md'
      - 'DOCS/**'
      - '**/DOCS/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      app:
        description: "Single app to publish (blank = all)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: resolve app matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        # The dispatch input reaches the shell as an env var, never spliced
        # into the script, and must name an app that has a Dockerfile
        # (SUITE_REVIEW_2026-11 C3).
        env:
          APP_INPUT: ${{ github.event.inputs.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_INPUT" ]; then
            if ! printf '%s' "$APP_INPUT" | grep -Eq '^[a-z0-9-]+$' || [ ! -f "apps/$APP_INPUT/Dockerfile" ]; then
              echo "::error::'$APP_INPUT' is not an app with apps/<app>/Dockerfile"
              exit 1
            fi
            echo "apps=$(jq -cn --arg a "$APP_INPUT" '[$a]')" >> "$GITHUB_OUTPUT"
          else
            # Only the images this push can have changed: an image COPYs its
            # own app, packages/ and the root manifests, nothing else
            # (tools/ci-affected.mjs). Measured from the last GREEN release
            # run, so a failed or cancelled run's apps are built by the next.
            base=$(gh run list --workflow release.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
            affected=$(node tools/ci-affected.mjs --for release --base "$base" | sed -n 's/^apps=//p')
            # Apps with root-level Dockerfiles (mirror build.sh APPS)
            apps=$(for d in apps/*/Dockerfile; do basename "$(dirname "$d")"; done | jq -R . | jq -sc --argjson hit "$affected" '[.[] | select(. as $a | $hit | index($a))]')
            echo "apps: $apps"
            echo "apps=$apps" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    name: publish ${{ matrix.app }}
    needs: matrix
    # A push that touched no image's inputs (tooling, a workflow) builds none.
    if: needs.matrix.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.matrix.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:sha-${{ steps.sha.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
