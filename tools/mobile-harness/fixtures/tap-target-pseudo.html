<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>tap-target pseudo fixture</title>
<style>
  /* Plain reset so measured boxes are exact px, no borders/margins to fudge
     the 44px arithmetic this fixture is trying to pin down. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px sans-serif; padding: 20px; }
  button { border: 0; background: #ddd; display: block; margin-bottom: 40px; }

  /* (a) 30px button, ::before positioned via inset:-7px — 30 + 7 + 7 = 44.
     Must PASS: a real, absolutely positioned, containing-block-is-the-button
     pseudo big enough to clear 44x44. */
  #positioned-inset { width: 30px; height: 30px; position: relative; }
  #positioned-inset::before {
    content: '';
    position: absolute;
    inset: -7px;
  }

  /* (b) 30px button, ::before present but NOT positioned (position: static,
     the default) — it paints inline with content and cannot enlarge the hit
     area. Must FAIL: real box is still 30x30. */
  #unpositioned { width: 30px; height: 30px; position: relative; }
  #unpositioned::before {
    content: '';
    display: inline-block;
    width: 44px;
    height: 44px;
  }

  /* (c) 30px button, ::before positioned and large enough (inset:-7px, same
     as (a)) but pointer-events:none — it can never receive the tap. Must
     FAIL: the enlarged box does not count. */
  #pointer-events-none { width: 30px; height: 30px; position: relative; }
  #pointer-events-none::before {
    content: '';
    position: absolute;
    inset: -7px;
    pointer-events: none;
  }

  /* (d) startgeek's real `.dot`: a 9px visual dot, 44px invisible centred
     pseudo via inset:-17.5px (9 + 17.5 + 17.5 = 44). Must PASS. */
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.5px solid #333;
    position: relative;
  }
  .dot::before { content: ''; position: absolute; inset: -17.5px; }

  /* (e) startgeek's real `.hit44`: a 30px visual button, centred 44x44
     pseudo via top/left:50% + translate(-50%,-50%) rather than inset. Must
     PASS — exercises the transform branch of pseudoHitBox. */
  .hit44 { position: relative; }
  .hit44::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    transform: translate(-50%, -50%);
  }

  /* (f)/(g) MUI <Rating>'s pattern: a visually-hidden <input type="radio">
     and its <label for="id"> are SIBLINGS, not nested
     (@mui/material/Rating/Rating.js — RatingLabel + <input> in a Fragment).
     `el.closest('label')` cannot find a for-linked label, so the probe has
     to look one up by id. The visually-hidden technique (clip + 1px box,
     not display:none) leaves the input's own rect at 1x1 but real. */
  .visually-hidden-radio {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  #rating-star-label-pass { display: inline-block; width: 44px; height: 44px; }
  #rating-star-label-fail { display: inline-block; width: 30px; height: 30px; }

  /* (h) MUI <Rating> with precision < 1: every half-star's label collapses
     to `width: 0%; overflow: hidden` unless it happens to be the exact
     current value (Rating.js's decimal branch), and its own "clear rating"
     label wraps nothing but visually-hidden children — both paint zero
     pixels. Must PASS (skipped, not flagged): there is no rendered area for
     a finger to find, so the 44px rule does not apply; it is a keyboard/
     screen-reader-only affordance, and the visible star at that position is
     a *different*, sibling element (the whole-value radio) measured on its
     own. */
  #rating-star-label-empty { display: inline-block; width: 0; height: 44px; overflow: hidden; }
</style>
</head>
<body>
  <button id="positioned-inset" aria-label="positioned-inset">a</button>
  <button id="unpositioned" aria-label="unpositioned">b</button>
  <button id="pointer-events-none" aria-label="pointer-events-none">c</button>
  <button class="dot" aria-label="dot"></button>
  <button class="hit44" style="width:30px;height:30px" aria-label="hit44">e</button>

  <label for="rating-star-input-pass" id="rating-star-label-pass"></label>
  <input type="radio" class="visually-hidden-radio" id="rating-star-input-pass" aria-label="rating-star-for-label" />

  <label for="rating-star-input-fail" id="rating-star-label-fail"></label>
  <input type="radio" class="visually-hidden-radio" id="rating-star-input-fail" aria-label="rating-star-for-label-small" />

  <label for="rating-star-input-empty" id="rating-star-label-empty"></label>
  <input type="radio" class="visually-hidden-radio" id="rating-star-input-empty" aria-label="rating-star-for-label-empty" />
</body>
</html>
