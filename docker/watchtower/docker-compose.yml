services:
  watchtower:
    # Maintained fork — containrrr/watchtower is stale and negotiates an
    # API version (1.25) the current daemon rejects (needs >=1.40).
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    # Watchtower only needs the docker socket, not container networking.
    # The box has exhausted its address pools, so reuse the host network
    # instead of creating a new bridge.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GeekSuite packages are public (anonymous pulls), but this host also
      # watchtowers the private rallycenter :preview images, which need a
      # read:packages login (docker login ghcr.io). Restart watchtower after
      # re-running docker login — the login rewrites config.json's inode and
      # the bind mount goes stale.
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      TZ: America/Chicago
      WATCHTOWER_POLL_INTERVAL: "300"        # 5 minutes
      WATCHTOWER_CLEANUP: "true"             # prune old images after update
      WATCHTOWER_LABEL_ENABLE: "true"        # ONLY update opted-in containers
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Rolling restart removed: incompatible with compose depends_on
      # (basegeek -> its DBs, rallycenter web -> api), which watchtower
      # refuses to roll and logs as an error. Normal stop/pull/start honors
      # depends_on with a few seconds of downtime per updated container.
