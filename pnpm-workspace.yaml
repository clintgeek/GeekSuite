packages:
    - "apps/*"
    - "apps/*/frontend"
    - "apps/*/backend"
    - "apps/*/web"
    - "apps/*/api"
    - "apps/*/packages/*"
    - "packages/*"

overrides:
    "@mui/material": "^5.0.0"
    "@mui/system": "^5.0.0"
    "react": "^18.3.1"
    "react-dom": "^18.3.1"

# pnpm 10+ ignores package.json#pnpm and requires explicit build approval.
# This restores the pre-v10 behavior for the workspace while we audit the list.
dangerouslyAllowAllBuilds: true

