<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4F0E6">
  <title>NewsGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --paper: #F4F0E6; --ink: #1B1A17; --soft: #47433B; --hair: #CFC7B5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #1C1A16; --ink: #EDE7DA; --soft: #CDC5B4; --hair: #433E35; }
    }
    body {
      font-family: 'Newsreader', 'Iowan Old Style', Charter, Georgia, 'Times New Roman', serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--paper); color: var(--ink); text-align: center;
      padding: calc(2rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right))
               calc(2rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
    }
    .page { width: 100%; max-width: 420px; border-top: 4px solid var(--ink); padding-top: 1.5rem; }
    h1 { font-size: 2.75rem; font-weight: 800; letter-spacing: -0.025em; line-height: 1; }
    .dateline {
      margin: 1.25rem 0 1.5rem; padding: 0.5rem 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
      font: 700 0.75rem/1.4 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft);
    }
    p { font-size: 1.0625rem; line-height: 1.6; color: var(--soft); margin-bottom: 1.75rem; }
    button {
      background: var(--ink); color: var(--paper); border: 0; border-radius: 2px;
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px;
      font: 600 1rem/1 'Libre Franklin', 'Franklin Gothic Medium', Arial, sans-serif; cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="page">
    <h1>NewsGeek</h1>
    <div class="dateline">Stop the presses — you're offline</div>
    <p>The paper can't reach the news desk right now. Stories are waiting on the server; try again when you're back online.</p>
    <button type="button" onclick="window.location.reload()">Retry</button>
  </main>
</body>
</html>
