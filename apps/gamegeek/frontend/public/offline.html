<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF1D0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0A12">
  <title>GameGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --page: #FFF1D0; --card: #FFFBF0; --text: #14111A; --muted: #3F3849;
      --accent: #B8005F; --accent-text: #FFFFFF; --rule: #14111A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0C0A12; --card: #17131F; --text: #F6F1FF; --muted: #C9C0DD;
        --accent: #FF3DA8; --accent-text: #0C0A12; --rule: #8E83B3;
      }
    }
    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--page); color: var(--text); text-align: center;
      padding: calc(2rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right))
               calc(2rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
    }
    .card { max-width: 380px; background: var(--card); border: 3px solid var(--rule); border-radius: 12px; padding: 2rem 1.5rem; box-shadow: 6px 6px 0 var(--accent); }
    svg { width: 96px; height: 63px; margin-bottom: 1rem; transform: rotate(-8deg); }
    h1 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
    p { font-size: 1rem; line-height: 1.55; color: var(--muted); margin-bottom: 1.5rem; }
    button {
      background: var(--accent); color: var(--accent-text);
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px; border-radius: 8px;
      border: 2px solid var(--rule); box-shadow: 3px 3px 0 var(--rule);
      font: 600 1rem/1 inherit; font-family: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- The Arcade Sticker gamepad (public/icons/icon.svg), inline so the page
         needs nothing from the network. -->
    <svg viewBox="30 140 460 300" aria-hidden="true">
      <path d="M176 168 H336 C404 168 436 204 448 262 L464 342 C472 390 438 418 404 410 C378 404 362 378 346 356 H166 C150 378 134 404 108 410 C74 418 40 390 48 342 L64 262 C76 204 108 168 176 168 Z" fill="#F6F1FF" stroke="#F6F1FF" stroke-width="40" stroke-linejoin="round"/>
      <path transform="translate(16 18)" d="M176 168 H336 C404 168 436 204 448 262 L464 342 C472 390 438 418 404 410 C378 404 362 378 346 356 H166 C150 378 134 404 108 410 C74 418 40 390 48 342 L64 262 C76 204 108 168 176 168 Z" fill="#22E4FF" stroke="#0C0A12" stroke-width="16" stroke-linejoin="round"/>
      <path d="M176 168 H336 C404 168 436 204 448 262 L464 342 C472 390 438 418 404 410 C378 404 362 378 346 356 H166 C150 378 134 404 108 410 C74 418 40 390 48 342 L64 262 C76 204 108 168 176 168 Z" fill="#FF3DA8" stroke="#0C0A12" stroke-width="16" stroke-linejoin="round"/>
      <path d="M150 232 H182 V260 H210 V292 H182 V320 H150 V292 H122 V260 H150 Z" fill="#D7FF3D" stroke="#0C0A12" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="344" cy="250" r="24" fill="#22E4FF" stroke="#0C0A12" stroke-width="10"/>
      <circle cx="390" cy="298" r="24" fill="#D7FF3D" stroke="#0C0A12" stroke-width="10"/>
    </svg>
    <h1>Game paused — you're offline</h1>
    <p>GameGeek needs a connection to load your library. Your progress is saved on the server; nothing is lost.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
