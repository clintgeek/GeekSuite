<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF1D0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C0A12">
  <title>GameGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --page: #FFF1D0; --card: #FFFBF0; --text: #14111A; --muted: #3F3849;
      --accent: #B8005F; --accent-text: #FFFFFF; --rule: #14111A;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0C0A12; --card: #17131F; --text: #F6F1FF; --muted: #C9C0DD;
        --accent: #FF3DA8; --accent-text: #0C0A12; --rule: #8E83B3;
      }
    }
    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--page); color: var(--text); text-align: center;
      padding: calc(2rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right))
               calc(2rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
    }
    .card { max-width: 380px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 2rem 1.5rem; }
    svg { width: 56px; height: 56px; margin-bottom: 1rem; }
    h1 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
    p { font-size: 1rem; line-height: 1.55; color: var(--muted); margin-bottom: 1.5rem; }
    button {
      background: var(--accent); color: var(--accent-text); border: none;
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px; border-radius: 8px;
      font: 600 1rem/1 inherit; font-family: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
      <rect x="2" y="1" width="12" height="14" fill="currentColor" opacity=".18"/>
      <rect x="4" y="1" width="8" height="5" fill="currentColor" opacity=".55"/>
      <rect x="9" y="2" width="2" height="3" fill="var(--page)"/>
      <rect x="4" y="9" width="8" height="5" fill="var(--accent)"/>
    </svg>
    <h1>Game paused — you're offline</h1>
    <p>GameGeek needs a connection to load your library. Your progress is saved on the server; nothing is lost.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
