    <!-- Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var refreshing = false;
          // Captured BEFORE registering. sw.js calls skipWaiting() and
          // clients.claim(), so a first-ever visit takes control of the page
          // that installed it and fires controllerchange — which used to
          // reload a page the visitor was already reading. Only an update
          // (there was already a controller) is worth a reload. Read it here
          // and not inside the handler: by the time controllerchange fires,
          // `controller` is the new worker either way.
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!hadController) return;
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register('/sw.js')
            .then(function(registration) {
              registration.update().catch(function() {});
            })
            .catch(function() {});
        });
      }
    </script>
  </body>
</html>
