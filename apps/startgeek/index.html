<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StartGeek</title>
    <meta name="description" content="Your calm personal desktop. The entry point for the GeekSuite app ecosystem." />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="GeekSuite Launcher" />
    <meta property="og:description" content="Your calm personal desktop. The entry point for the GeekSuite app ecosystem." />
    <meta property="og:type" content="website" />

    <!-- Favicon (inline SVG as data URI) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%230a0d12'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register('/sw.js')
            .then(function(registration) {
              registration.update().catch(function() {});
            })
            .catch(function() {});
        });
      }
    </script>
  </body>
</html>
