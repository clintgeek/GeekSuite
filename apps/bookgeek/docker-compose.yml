
services:
  bookgeek:
    image: ghcr.io/clintgeek/bookgeek:latest
    container_name: bookgeek
    restart: unless-stopped

    labels:
      com.centurylinklabs.watchtower.enable: "true"

    networks:
      - datageek_network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env.production

    environment:
      TZ: America/Chicago
      NODE_ENV: production
      API_PORT: 1800
      LIBRARY_PATH: /data/library
      COVERS_PATH: /data/covers
      TEMP_PATH: /data/temp
      ADDME_PATH: /data/addMe

    ports:
      - "1800:1800"

    volumes:
      - /mnt/extra_space/books:/data/library
      - /mnt/extra_space/books/temp:/data/temp
      - /mnt/extra_space/books/addMe:/data/addMe
      # COVERS_PATH pointed at an unmounted /data/covers until 2026-09-05, so
      # covers lived inside the container and vanished on every recreate.
      - /mnt/extra_space/books/covers:/data/covers

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:1800/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datageek_network:
    external: true
