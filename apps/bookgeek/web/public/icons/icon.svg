<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BookGeek "Midnight Reader": a sky cloth-bound book with a gold rule and an
       amber bookmark ribbon, on the navy night. Master for icon-192/512.png. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151e2f"/><stop offset="1" stop-color="#0b1222"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0284c7"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <g id="book">
    <!-- page block -->
    <rect x="178" y="104" width="190" height="300" rx="10" fill="#f4ecdb"/>
    <rect x="178" y="104" width="190" height="300" rx="10" fill="none" stroke="#dcc796" stroke-width="4"/>
    <!-- cover -->
    <rect x="144" y="88" width="208" height="316" rx="12" fill="url(#cloth)"/>
    <!-- spine board + crease -->
    <rect x="144" y="88" width="44" height="316" rx="12" fill="#0369a1"/>
    <rect x="186" y="88" width="6" height="316" fill="#0b1222" fill-opacity="0.35"/>
    <!-- gold rules -->
    <rect x="212" y="124" width="116" height="8" rx="4" fill="#dcc796"/>
    <rect x="212" y="360" width="116" height="8" rx="4" fill="#dcc796"/>
    <!-- title label -->
    <rect x="222" y="176" width="96" height="56" rx="6" fill="#f4ecdb"/>
    <!-- ribbon: hangs from the top edge, out past the tail of the book -->
    <path d="M292 88 H332 V452 L312 430 L292 452 Z" fill="#f59e0b"/>
    <path d="M292 88 H332 V104 H292 Z" fill="#b45309" fill-opacity="0.55"/>
  </g>
</svg>
