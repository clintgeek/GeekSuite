<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8ecf1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#010409">
  <title>BookGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --page: #e8ecf1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #010409;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #0ea5e9;
        --accent-hover: #38bdf8;
        --accent-text: #0b1220;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--page); color: var(--text);
      text-align: center;
      padding: 2rem;
      padding-top: calc(2rem + env(safe-area-inset-top));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
      padding-left: calc(2rem + env(safe-area-inset-left));
      padding-right: calc(2rem + env(safe-area-inset-right));
    }
    .card { max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent);
    }
    p { font-size: 1rem; line-height: 1.6; color: var(--muted); margin-bottom: 1.5rem; }
    button {
      background: var(--accent); color: var(--accent-text); border: none;
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📚</div>
    <h1>You're offline</h1>
    <p>BookGeek needs an internet connection to work. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
