<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BookGeek</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8ecf1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#010409" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var refreshing = false;
          // Captured BEFORE registering. sw.js calls skipWaiting() and
          // clients.claim(), so a first-ever visit takes control of the page
          // that installed it and fires controllerchange — which used to
          // reload a page the visitor was already reading. Only an update
          // (there was already a controller) is worth a reload. Read it here
          // and not inside the handler: by the time controllerchange fires,
          // `controller` is the new worker either way.
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!hadController) return;
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });

          navigator.serviceWorker
            .register('/sw.js')
            .then(function(registration) {
              registration.update().catch(function() {});
            })
            .catch(function() {});
        });
      }
    </script>
  </body>
</html>
