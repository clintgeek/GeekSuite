services:
  mongodb:
    image: mongo:latest
    container_name: datageek_mongodb
    ports:
      - "27018:27017"
    # MONGO_INITDB_ROOT_USERNAME/PASSWORD used to be plain ${VAR} substitutions
    # with no .env next to this file, so a force-recreate of this service
    # would have booted Mongo with blank root creds. BURN_REVIEW_2 #10: a
    # brief env_file: .env.production fix handed this container all ~40
    # basegeek secrets instead of the two it needs. Least-privilege fix: a
    # `.env` symlink to .env.production (see DEPLOY.md "Datastore env
    # convention") makes ${VAR} substitution below resolve without env_file,
    # so only the names listed here ever reach this container.
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./data/mongodb:/data/db
      - ./mongodb-init.js:/docker-entrypoint-initdb.d/mongodb-init.js
    networks:
      - datageek_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  influxdb:
    image: influxdb:1.8
    container_name: datageek_influxdb
    ports:
      - "8086:8086"
    environment:
      # Note: INFLUXDB_ADMIN_USER/PASSWORD only used for initial setup
      # Once data exists, auth is configured in influxdb.conf
      - INFLUXDB_DB=geekdata
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - ./data/influxdb:/var/lib/influxdb
      - ./data/influxdb-config:/etc/influxdb
    networks:
      - datageek_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    container_name: datageek_redis
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - datageek_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15
    container_name: datageek_postgres
    ports:
      - "55432:5432"
    # Same least-privilege fix as mongodb above — see that comment.
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - datageek_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  basegeek:
    image: ghcr.io/clintgeek/basegeek:latest
    container_name: basegeek
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=8987
      # CSRF double-submit: enforce (flipped 2026-09-06 after a clean report-only
      # window — the only report lines were a stale pre-deploy startgeek tab).
      # Set to "report" here to roll back without touching .env.production.
      - CSRF_TOKEN=report
    ports:
      - "8987:8987"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - datageek_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8987/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # basegeek's own log shows ~15-25s to "listening" on this box; give it
      # room before the first failed probe counts against retries (BURN_REVIEW_2 #12).
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datageek_network:
    external: true

