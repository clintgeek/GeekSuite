services:
  mongodb:
    image: mongo:latest
    container_name: datageek_mongodb
    ports:
      - "27018:27017"
    # MONGO_INITDB_ROOT_USERNAME/PASSWORD used to be plain ${VAR} substitutions
    # with no env_file — compose reads those only from its own .env next to
    # this file, which does not exist here, so a force-recreate of this
    # service would have booted Mongo with blank root creds. .env.production
    # already declares both names; load it here too so a recreate is safe.
    env_file:
      - .env.production
    environment:
      - TZ=America/Chicago
    volumes:
      - ./data/mongodb:/data/db
      - ./mongodb-init.js:/docker-entrypoint-initdb.d/mongodb-init.js
    networks:
      - datageek_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  influxdb:
    image: influxdb:1.8
    container_name: datageek_influxdb
    ports:
      - "8086:8086"
    environment:
      # Note: INFLUXDB_ADMIN_USER/PASSWORD only used for initial setup
      # Once data exists, auth is configured in influxdb.conf
      - TZ=America/Chicago
      - INFLUXDB_DB=geekdata
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - ./data/influxdb:/var/lib/influxdb
      - ./data/influxdb-config:/etc/influxdb
    networks:
      - datageek_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    container_name: datageek_redis
    ports:
      - "6380:6379"
    environment:
      - TZ=America/Chicago
    volumes:
      - ./data/redis:/data
    networks:
      - datageek_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15
    container_name: datageek_postgres
    ports:
      - "55432:5432"
    # Same env_file fix as mongodb above — see that comment.
    env_file:
      - .env.production
    environment:
      - TZ=America/Chicago
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - datageek_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  basegeek:
    image: ghcr.io/clintgeek/basegeek:latest
    container_name: basegeek
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file:
      - .env.production
    environment:
      - TZ=America/Chicago
      - NODE_ENV=production
      - PORT=8987
    ports:
      - "8987:8987"
    depends_on:
      - mongodb
      - redis
      - postgres
      - influxdb
    networks:
      - datageek_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8987/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datageek_network:
    external: true

