<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#15120F">
  <title>ThingGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --desk: #D2B48A; --card: #E6D2AF; --text: #16120D; --muted: #44352A;
      --rule: rgba(22, 18, 13, 0.34); --shadow: 0 3px 0 rgba(60, 38, 14, 0.25);
      --bar: #15120F; --bar-text: #F4E8D4; --orange: #F26B1D; --burnt: #A9420A; --ink: #140E08; --focus: #16120D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #121110; --card: #2A231C; --text: #F2E8D8; --muted: #CDBFA8;
        --rule: rgba(242, 232, 216, 0.26); --shadow: 0 3px 0 rgba(0, 0, 0, 0.6);
        --focus: #F2E8D8;
      }
    }
    body {
      font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--desk); color: var(--text); text-align: center;
      padding: calc(2rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right))
               calc(2rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
    }
    .card {
      width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--rule);
      border-radius: 4px; box-shadow: var(--shadow); overflow: hidden;
    }
    /* the truck's black flank, with its speed stripes */
    .flank {
      height: 56px; background: var(--bar);
      background-image: repeating-linear-gradient(116deg, transparent 0 18px, var(--orange) 18px 32px, transparent 32px 38px, var(--burnt) 38px 44px, transparent 44px 64px);
      border-bottom: 4px solid var(--orange);
    }
    .body { padding: 1.5rem 1.5rem 2rem; }
    svg { display: block; width: 112px; height: auto; margin: 0 auto 1rem; }
    h1 {
      font-family: 'Zilla Slab', Rockwell, 'Roboto Slab', Georgia, serif;
      font-size: 1.75rem; font-weight: 700; line-height: 1.1; margin-bottom: 0.5rem;
    }
    p { font-size: 1rem; line-height: 1.55; color: var(--muted); margin-bottom: 1.5rem; }
    button {
      background: var(--orange); color: var(--ink); border: 2px solid var(--ink);
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px; border-radius: 4px;
      font: 800 1.0625rem/1 'Public Sans', system-ui, sans-serif; cursor: pointer;
      box-shadow: 0 4px 0 var(--burnt);
    }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="flank" aria-hidden="true"></div>
    <div class="body">
      <!-- The mark: a taped moving box with its orange band (as icons/icon.svg). -->
      <svg viewBox="90 130 330 300" aria-hidden="true">
        <ellipse cx="262" cy="420" rx="168" ry="16" fill="#000000" fill-opacity="0.3"/>
        <g stroke="#16120D" stroke-width="10" stroke-linejoin="round">
          <path d="M104 196 L170 146 H406 L340 196 Z" fill="#D9AE78"/>
          <path d="M340 196 L406 146 V352 L340 404 Z" fill="#A87A45"/>
          <rect x="104" y="196" width="236" height="208" fill="#C99A62"/>
        </g>
        <path d="M206 196 L272 146 H306 L240 196 Z" fill="#EAD7B5"/>
        <rect x="206" y="201" width="34" height="46" fill="#EAD7B5"/>
        <rect x="168" y="262" width="108" height="24" rx="12" fill="#16120D"/>
        <rect x="109" y="318" width="226" height="44" fill="#F26B1D"/>
        <path d="M345 314 L401 270 V306 L345 350 Z" fill="#DD5C12"/>
      </svg>
      <h1>You're offline</h1>
      <p>The truck's parked until the connection's back. Everything you've recorded is safe on the server.</p>
      <button type="button" onclick="window.location.reload()">Retry</button>
    </div>
  </div>
</body>
</html>
