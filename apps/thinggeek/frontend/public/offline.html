<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2EEE5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13120F">
  <title>ThingGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --page: #F2EEE5; --card: #FFFDF9; --text: #1D1B17; --muted: #4A453C;
      --accent: #1D6546; --accent-text: #FFFFFF; --brass: #A87B2B; --rule: rgba(29, 27, 23, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #13120F; --card: #1B1A16; --text: #EFEADF; --muted: #C2BBAD;
        --accent: #7CC9A0; --accent-text: #0E1A13; --brass: #D2A857; --rule: rgba(239, 234, 223, 0.12);
      }
    }
    body {
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--page); color: var(--text); text-align: center;
      padding: calc(2rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right))
               calc(2rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
    }
    .card { max-width: 380px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 2rem 1.5rem; }
    svg { width: 56px; height: 56px; margin-bottom: 1rem; }
    h1 { font-size: 1.375rem; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
    p { font-size: 1rem; line-height: 1.55; color: var(--muted); margin-bottom: 1.5rem; }
    button {
      background: var(--accent); color: var(--accent-text); border: none;
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px; border-radius: 8px;
      font: 600 1rem/1 inherit; font-family: inherit; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <g transform="rotate(-14 16 16)">
        <path d="M11 8 H24 a3 3 0 0 1 3 3 V21 a3 3 0 0 1 -3 3 H11 L5 16 Z" fill="var(--accent)"/>
        <circle cx="10.5" cy="16" r="1.9" fill="var(--card)" stroke="var(--brass)" stroke-width="1.2"/>
        <rect x="14.5" y="13" width="9" height="1.6" rx=".8" fill="var(--card)"/>
        <rect x="14.5" y="17" width="6" height="1.6" rx=".8" fill="var(--card)" fill-opacity=".6"/>
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>ThingGeek needs a connection to open the ledger. Everything you've recorded is safe on the server.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
