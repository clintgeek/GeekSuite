<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed kraft; the tape (icon.svg) scaled into the central 80% safe circle. -->
  <defs>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E0C69E"/><stop offset="0.55" stop-color="#D2B284"/><stop offset="1" stop-color="#BE9764"/></linearGradient>
    <pattern id="flute" width="14" height="512" patternUnits="userSpaceOnUse"><rect width="5" height="512" fill="#6B4A22" fill-opacity="0.06"/></pattern>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34312D"/><stop offset="0.14" stop-color="#1E1C1A"/><stop offset="0.45" stop-color="#121110"/><stop offset="0.85" stop-color="#121110"/><stop offset="1" stop-color="#1F1D1B"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0.35"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.66" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0.09"/><stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9F7F1"/><stop offset="0.6" stop-color="#F0ECE3"/><stop offset="1" stop-color="#D9D3C7"/></linearGradient>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="dent" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#kraft)"/>
  <rect width="512" height="512" fill="url(#flute)"/>
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
      <g transform="rotate(-4 256 256)">
        <!-- the tape's cast shadow on the kraft -->
        <path d="M60 196 L76 180 H436 L452 196 V332 L436 348 H76 L60 332 Z" fill="#3A2610" fill-opacity="0.45" filter="url(#soft)" transform="translate(0 10)"/>
        <!-- tape body, cutter-clipped corners -->
        <path d="M56 190 L72 174 H440 L456 190 V322 L440 338 H72 L56 322 Z" fill="url(#tape)"/>
        <!-- gloss: a soft band along the top third, a faint diagonal glint -->
        <path d="M62 186 L74 178 H438 L450 186 V226 H62 Z" fill="url(#sheen)"/>
        <path d="M56 190 L72 174 H440 L456 190 V322 L440 338 H72 L56 322 Z" fill="url(#gloss)"/>
        <path d="M73 176.5 H439 L453 190.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="3"/>
        <path d="M58 322 L72 336 H440 L454 322" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="3"/>
        <!-- the embossed T: the press dents the tape (shadow), the raised plastic whitens -->
        <path d="M183 205 H329 V237 H273 V311 H239 V237 H183 Z" fill="#000000" fill-opacity="0.7" stroke="#000000" stroke-opacity="0.7" stroke-width="6" stroke-linejoin="round" filter="url(#dent)" transform="translate(2 6)"/>
        <path d="M183 205 H329 V237 H273 V311 H239 V237 H183 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" transform="translate(-1 -2)"/>
        <path d="M183 205 H329 V237 H273 V311 H239 V237 H183 Z" fill="url(#letter)" stroke="url(#letter)" stroke-width="6" stroke-linejoin="round"/>
      </g>
  </g>
</svg>
