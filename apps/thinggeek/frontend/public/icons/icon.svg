<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Moving Day: a taped moving box with its orange band, on the truck's black flank with three speed stripes. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#15120F"/>
  <g clip-path="url(#tile)">
    <path d="M300 512 L470 0 H540 L370 512 Z" fill="#F26B1D"/>
    <path d="M392 512 L562 0 H596 L426 512 Z" fill="#A9420A"/>
    <path d="M448 512 L618 0 H640 L470 512 Z" fill="#F26B1D"/>
    <rect y="440" width="512" height="20" fill="#F26B1D"/>
  </g>
  <!-- the box's shadow on the floor -->
  <ellipse cx="262" cy="420" rx="168" ry="16" fill="#000000" fill-opacity="0.45"/>
  <g stroke="#16120D" stroke-width="10" stroke-linejoin="round">
    <path d="M104 196 L170 146 H406 L340 196 Z" fill="#D9AE78"/>
    <path d="M340 196 L406 146 V352 L340 404 Z" fill="#A87A45"/>
    <rect x="104" y="196" width="236" height="208" fill="#C99A62"/>
  </g>
  <!-- packing tape over the seam and down the front -->
  <path d="M206 196 L272 146 H306 L240 196 Z" fill="#EAD7B5"/>
  <rect x="206" y="201" width="34" height="46" fill="#EAD7B5"/>
  <!-- the hand-hold -->
  <rect x="168" y="262" width="108" height="24" rx="12" fill="#16120D"/>
  <!-- the printed band -->
  <rect x="109" y="318" width="226" height="44" fill="#F26B1D"/>
  <path d="M345 314 L401 270 V306 L345 350 Z" fill="#DD5C12"/>
  <!-- THIS SIDE UP -->
  <path d="M132 392 l13 -18 l13 18 h-8 v9 h-10 v-9 z M164 392 l13 -18 l13 18 h-8 v9 h-10 v-9 z" fill="#16120D" fill-opacity="0.85"/>
</svg>
