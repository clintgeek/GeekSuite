<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF7EE">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16140F">
  <title>NoteGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --page: #FBF7EE;
      --text: #1F1C16;
      --muted: #6b6456;
      --accent: #8B2C2A;
      --accent-hover: #a83a37;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #16140F;
        --text: #EDE6D6;
        --muted: #b8ab90;
        --accent: #c4514d;
        --accent-hover: #d97370;
        --accent-text: #16140F;
      }
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--page); color: var(--text);
      text-align: center;
      padding: 2rem;
      padding-top: calc(2rem + env(safe-area-inset-top));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
      padding-left: calc(2rem + env(safe-area-inset-left));
      padding-right: calc(2rem + env(safe-area-inset-right));
    }
    .card { max-width: 400px; }
    .icon {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 2.5rem; margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--accent); }
    p { font-size: 1rem; line-height: 1.6; color: var(--muted); margin-bottom: 1.5rem; }
    button {
      background: var(--accent); color: var(--accent-text); border: none;
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📝</div>
    <h1>You're offline</h1>
    <p>NoteGeek needs an internet connection to work. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
