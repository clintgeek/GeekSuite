  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#3A3936" stroke-opacity="0.35"/>
  <rect x="6" y="21" width="21" height="6" rx="1.5" fill="#F5DF4D" transform="rotate(-5 16 24)"/>
  <g transform="rotate(-45 16 16)">
    <rect x="9" y="13" width="15" height="6" fill="#3A3936"/>
    <rect x="24" y="12.6" width="4" height="6.8" rx="1" fill="#6B6F6C"/>
    <path d="M9 13 L9 19 L4 16 Z" fill="#D8C39A"/>
    <path d="M6 15 L6 17 L4 16 Z" fill="#2F2E2B"/>
  </g>
</svg>
