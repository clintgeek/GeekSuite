<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: public/icons/*.svg are the masters; the PNGs and favicon.ico
         are rendered from them by tools/pwa-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NoteGeek</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F4EF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1F22" />
    <!-- Fonts are self-hosted (src/main.jsx imports @fontsource-variable/spline-sans
         and @fontsource-variable/spline-sans-mono) so the PWA keeps its faces
         offline; Vite emits the woff2 files and the service worker precaches
         them. The "Graphite" identity (DOCS/CONTEXT.md §7) is these two faces:
         the sans for titles and body, the mono for small metadata only. -->
    <!-- Baseline desk/ink colours that snap before MUI mounts. Must match
         theme/graphite.js desk + ink, or React's first paint repaints. -->
    <style>
      :root                    { color-scheme: light; background-color: #E9EEE7; color: #2F2E2B; }
      :root[data-theme="dark"] { color-scheme: dark; background-color: #15181A; color: #E6E3DC; }
      body                     { margin: 0; background-color: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
