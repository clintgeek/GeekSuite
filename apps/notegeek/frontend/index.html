<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons: public/icons/*.svg are the masters; the PNGs and favicon.ico
         are rendered from them by tools/pwa-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NoteGeek</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF7EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16140F" />
    <!-- Fonts are self-hosted (src/main.jsx imports @fontsource-variable/geist
         and @fontsource/jetbrains-mono) so the PWA keeps its typefaces offline;
         Vite emits the woff2 files and the service worker precaches them.
         Geist is display + body; JetBrains Mono is every piece of metadata
         (timestamps, tags, type stamps, the save stamp). The "Lab Notebook"
         identity rides on this sans/mono pair; do not add a third typeface
         without revisiting the design (DOCS/CONTEXT.md). -->
    <!-- Baseline cream/ink colors that snap before MUI mounts.
         Must EXACTLY match createAppTheme.js's surfaces.default + text.primary,
         or you'll get a brief repaint when React boots. -->
    <style>
      :root                    { color-scheme: light; background-color: #FBF7EE; color: #1F1C16; }
      :root[data-theme="dark"] { color-scheme: dark; background-color: #16140F; color: #EDE6D6; }
      body                     { margin: 0; background-color: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
