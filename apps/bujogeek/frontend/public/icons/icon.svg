<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- BuJoGeek: one bullet, done. An ink bullet with a paper tick knocked out,
       on laid paper with a faint dot grid. Deliberately plain: the app is
       being rebuilt as a simple to-do list (DOCS/SIMPLE_PLAN.md) and this
       should survive whatever identity that brings. Master for icon-192/512. -->
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse" x="16" y="16"><circle cx="8" cy="8" r="4" fill="#1C1A18" fill-opacity="0.12"/></pattern>
  </defs>
  <rect width="512" height="512" rx="112" fill="#FAF8F5"/>
  <rect width="512" height="512" rx="112" fill="url(#dots)"/>
  <circle cx="256" cy="256" r="156" fill="#1C1A18"/>
  <path d="M184 262 L236 314 L334 208" fill="none" stroke="#FAF8F5" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
