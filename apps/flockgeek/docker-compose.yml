services:
  flockgeek:
    image: ghcr.io/clintgeek/flockgeek:latest
    container_name: flockgeek
    restart: unless-stopped

    labels:
      com.centurylinklabs.watchtower.enable: "true"

    networks:
      - datageek_network

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: 5001

    ports:
      - "5001:5001"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datageek_network:
    external: true
