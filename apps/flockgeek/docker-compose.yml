services:
  flockgeek:
    image: ghcr.io/clintgeek/flockgeek:latest
    container_name: flockgeek
    restart: unless-stopped

    labels:
      com.centurylinklabs.watchtower.enable: "true"

    networks:
      - datageek_network

    env_file:
      - .env.production

    environment:
      TZ: America/Chicago
      NODE_ENV: production
      PORT: 5001

    ports:
      - "5001:5001"

networks:
  datageek_network:
    external: true
