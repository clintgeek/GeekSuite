<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ECEEF2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0F12">
  <title>FitnessGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* The Label: a grey ground, a white panel with a 2px ink border, a heavy
       grotesque title over a thick rule, and one blue button. The webfont may
       not be cached offline, so the stack falls back to system grotesques. */
    :root {
      color-scheme: light dark;
      --ground: #ECEEF2;
      --panel: #FFFFFF;
      --ink: #111318;
      --muted: #3D414B;
      --blue: #1F3FD1;
      --blue-hover: #1630A8;
      --blue-text: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #0E0F12;
        --panel: #17181C;
        --ink: #F2F2EE;
        --muted: #C4C7CF;
        --blue: #8FA6FF;
        --blue-hover: #B3C2FF;
        --blue-text: #0E0F12;
      }
    }
    body {
      font-family: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--ground); color: var(--ink);
      padding: 1rem;
      padding-top: calc(1rem + env(safe-area-inset-top));
      padding-bottom: calc(1rem + env(safe-area-inset-bottom));
      padding-left: calc(1rem + env(safe-area-inset-left));
      padding-right: calc(1rem + env(safe-area-inset-right));
    }
    .panel {
      width: 100%; max-width: 420px;
      background: var(--panel); border: 2px solid var(--ink);
      padding: 1.25rem;
    }
    h1 {
      font-weight: 900; font-size: 2.25rem; line-height: 1; letter-spacing: -0.01em;
      padding-bottom: 0.5rem; border-bottom: 10px solid var(--ink);
      margin-bottom: 1rem;
    }
    p { font-size: 1rem; line-height: 1.5; color: var(--muted); margin-bottom: 1.25rem; }
    button {
      display: block; width: 100%;
      background: var(--blue); color: var(--blue-text); border: none; border-radius: 4px;
      padding: 0.75rem 2rem; min-height: 52px; min-width: 44px;
      font-size: 1.0625rem; font-weight: 800; cursor: pointer; font-family: inherit;
    }
    button:hover { background: var(--blue-hover); }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    @media (min-width: 480px) { button { display: inline-block; width: auto; } }
  </style>
</head>
<body>
  <main class="panel">
    <h1>You're offline</h1>
    <p>FitnessGeek needs an internet connection to work. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </main>
</body>
</html>
