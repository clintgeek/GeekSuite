services:
  storygeek:
    image: ghcr.io/clintgeek/storygeek:latest
    container_name: storygeek
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # All runtime secrets (DB_URI, JWT_SECRET, JWT_REFRESH_SECRET, BASEGEEK_URL,
    # AI_GEEK_API_KEY, Mongo root creds) are loaded from .env.production by
    # env_file. This directive was missing entirely until 2026-09-05 — every
    # other app's compose file has it — so this container never received
    # .env.production at all; it ran on whatever docker compose's own `.env`
    # file (a separate, stale, uncommitted file next to this one) happened to
    # interpolate into the literal ${VAR} substitutions below, and anything not
    # named as a substitution (AI_GEEK_API_KEY, CORS_ORIGINS) never reached the
    # container regardless of restarts — see STATUS.md Q1 ("restart storygeek
    # to pick up its service key"), which this closes.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 9977
      # TEMPORARY (2026-09-05): .env.production's DB_URI line is malformed
      # (`DB_URI=MONGODB_URI=mongodb://…`, a pasted concatenation) and the app
      # crash-loops on it. Until Chef fixes that line, DB_URI is substituted
      # here from the local .env, which is what the old compose did. Remove this
      # override once .env.production's DB_URI starts with mongodb://.
      DB_URI: ${DB_URI}
      STORYGEEK_FREE_ONLY: ${STORYGEEK_FREE_ONLY:-true}
      # Pinned Game Master model — narrative consistency beats model rotation.
      # gemini-flash-latest is the id the deployed aiGeek free-tier catalog
      # maintains; set an exact snapshot id here to lock harder.
      STORYGEEK_GM_PROVIDER: ${STORYGEEK_GM_PROVIDER:-gemini}
      STORYGEEK_GM_MODEL: ${STORYGEEK_GM_MODEL:-gemini-flash-latest}
      # Cheap auxiliary model for state extraction / summaries (defaults to GM model).
      STORYGEEK_AUX_PROVIDER: ${STORYGEEK_AUX_PROVIDER:-}
      STORYGEEK_AUX_MODEL: ${STORYGEEK_AUX_MODEL:-}
    ports:
      - "9977:9977"
    networks:
      - datageek_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9977/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datageek_network:
    external: true
