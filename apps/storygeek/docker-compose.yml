services:
  storygeek:
    image: ghcr.io/clintgeek/storygeek:latest
    container_name: storygeek
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    # All runtime secrets (DB_URI, JWT_SECRET, JWT_REFRESH_SECRET, BASEGEEK_URL,
    # AI_GEEK_API_KEY, Mongo root creds) are loaded from .env.production by
    # env_file. This directive was missing entirely until 2026-09-05 — every
    # other app's compose file has it — so this container never received
    # .env.production at all; it ran on whatever docker compose's own `.env`
    # file (a separate, stale, uncommitted file next to this one) happened to
    # interpolate into the literal ${VAR} substitutions below, and anything not
    # named as a substitution (AI_GEEK_API_KEY, CORS_ORIGINS) never reached the
    # container regardless of restarts — see STATUS.md Q1 ("restart storygeek
    # to pick up its service key"), which this closes.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 9977
      # No model configuration lives here any more (Phase 2 of
      # DOCS/AIGEEK_ELEVATION_PLAN.md, Chef's decision D4). Five variables came
      # out — STORYGEEK_FREE_ONLY, STORYGEEK_GM_PROVIDER, STORYGEEK_GM_MODEL,
      # STORYGEEK_AUX_PROVIDER, STORYGEEK_AUX_MODEL — because a model id typed
      # by a human is a promise that expires the next time a vendor retires a
      # slug, and this file had no way to notice. Routing is aiGeek's
      # AIAppConfig row for app `storygeek` (`sticky: per-conversation`,
      # `allowPaid` where STORYGEEK_FREE_ONLY used to be), and the code simply
      # stopped reading these — removing a variable needs no rebuild.
    ports:
      - "9977:9977"
    networks:
      - datageek_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9977/api/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  datageek_network:
    external: true
