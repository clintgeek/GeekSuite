<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4ece1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1614">
  <title>StoryGeek — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --page: #f4ece1;
      --text: #2c1810;
      --muted: #5a4636;
      --accent: #8b2635;
      --accent-hover: #6d1f2b;
      --accent-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #1a1614;
        --text: #e8dcc8;
        --muted: #b8a890;
        --accent: #c9a84c;
        --accent-hover: #e0c872;
        --accent-text: #1a1614;
      }
    }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
      background: var(--page); color: var(--text);
      text-align: center;
      padding: 2rem;
      padding-top: calc(2rem + env(safe-area-inset-top));
      padding-bottom: calc(2rem + env(safe-area-inset-bottom));
      padding-left: calc(2rem + env(safe-area-inset-left));
      padding-right: calc(2rem + env(safe-area-inset-right));
    }
    .card { max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 {
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--accent);
    }
    p { font-size: 1rem; line-height: 1.6; color: var(--muted); margin-bottom: 1.5rem; }
    button {
      background: var(--accent); color: var(--accent-text); border: none;
      padding: 0.75rem 2rem; min-height: 44px; min-width: 44px;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📖</div>
    <h1>You're offline</h1>
    <p>StoryGeek needs an internet connection to work. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
